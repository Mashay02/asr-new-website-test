<!doctype html>
<!--
  ASR CLOUDSCAPE — ambient background for the landing page
  ════════════════════════════════════════════════════════
  A slow, endless glide over a sea of clouds at dawn, graded to the
  ASR palette (petrol blue-grey clouds, copper dawn on the horizon).
  Self-contained apart from Three.js (import-mapped from CDN).

  HOW TO USE LATER, behind the landing page hero — either:
    a) <iframe src="cloud-background.html"> position:fixed; inset:0;
       z-index:-1; pointer-events:none; border:0
    b) copy the <script type="module"> below into the site and give the
       canvas the same fixed, z-index:-1 treatment
    c) use the recorded .mp4/.webm as <video autoplay muted loop
       playsinline> with the same positioning
  Respects prefers-reduced-motion (renders one still frame).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASR Cloudscape</title>
<style>
  *{margin:0}
  html,body{height:100%}
  body{
    overflow:hidden;
    /* the sky itself: cool slate up top, copper dawn at the horizon */
    background:
      radial-gradient(30% 24% at 64% 40%, rgba(255,232,192,.8) 0%, rgba(255,213,158,.35) 45%, rgba(255,203,146,0) 100%),
      radial-gradient(70% 50% at 64% 46%, rgba(255,206,150,.4) 0%, rgba(255,199,143,0) 70%),
      linear-gradient(180deg,
        #16212C 0%, #23303C 30%, #3C4653 52%,
        #6E6355 68%, #A67C5B 80%, #D9A876 92%, #EFC69A 100%);
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .tag{
    position:fixed;left:14px;bottom:12px;z-index:2;
    font:500 11px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.14em;
    color:rgba(233,243,247,.5);text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<p class="tag">ASR Cloudscape · background loop</p>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('sky');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.6));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xA98E74, 0.00040);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 1, 9000);

/* ---------- procedurally painted textures (no assets) ---------- */

// a soft cloud puff: several offset radial blobs so it isn't a perfect ball
function puffTexture() {
  const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  const blob = (x, y, r, a) => {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(255,255,255,${a})`);
    gr.addColorStop(0.55, `rgba(255,255,255,${a * 0.45})`);
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
  };
  blob(128, 140, 110, 0.85);
  blob(88, 120, 70, 0.7);
  blob(175, 118, 74, 0.7);
  blob(128, 96, 60, 0.6);
  blob(70, 155, 52, 0.5);
  blob(190, 158, 50, 0.5);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// a hazy mountain ridge silhouette
function ridgeTexture(seed, dark) {
  const w = 1024, h = 256, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  let x = 0, y = h * 0.55, pts = [[0, h], [0, y]];
  while (x < w) {
    x += 30 + ((seed = (seed * 16807) % 2147483647) % 60);
    y = h * 0.22 + (seed % 1000) / 1000 * h * 0.5;
    pts.push([Math.min(x, w), y]);
  }
  pts.push([w, h]);
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, dark);
  grad.addColorStop(1, 'rgba(60,70,83,0)');
  g.fillStyle = grad;
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (const p of pts) g.lineTo(p[0], p[1]);
  g.closePath(); g.fill();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ---------- the cloud field ---------- */

const puff = puffTexture();
const small = Math.min(innerWidth, innerHeight) < 700;
const COUNT = small ? 280 : 560;
const DEPTH = 5000;
const warm = new THREE.Color(0xF2DEC8);   // sun side
const cool = new THREE.Color(0x93A6B6);   // shadow side (petrol grey)
const clouds = [];

for (let i = 0; i < COUNT; i++) {
  const m = new THREE.SpriteMaterial({
    map: puff, transparent: true, depthWrite: false, fog: true,
    opacity: 0.2 + Math.random() * 0.22,
    rotation: Math.random() * Math.PI * 2,
  });
  const sp = new THREE.Sprite(m);
  sp.position.set(
    (Math.random() - 0.5) * 3000,
    -150 - Math.random() * 170,
    -Math.random() * DEPTH
  );
  const sc = 300 + Math.random() * 380;
  sp.scale.set(sc, sc * (0.42 + Math.random() * 0.2), 1);
  // clouds toward the sun (right of frame) pick up the dawn
  const t = THREE.MathUtils.clamp((sp.position.x + 600) / 1800, 0, 1);
  m.color.copy(cool).lerp(warm, t * (0.45 + Math.random() * 0.55));
  sp.userData.drift = 2 + Math.random() * 6;
  clouds.push(sp);
  scene.add(sp);
}

/* ---------- ridges, sun, light haze plane ---------- */

const ridgeFar = new THREE.Sprite(new THREE.SpriteMaterial({
  map: ridgeTexture(97, 'rgba(52,62,76,.85)'), transparent: true, depthWrite: false, fog: false, opacity: .8 }));
ridgeFar.scale.set(7200, 460, 1);
scene.add(ridgeFar);

const ridgeNear = new THREE.Sprite(new THREE.SpriteMaterial({
  map: ridgeTexture(311, 'rgba(38,47,59,.95)'), transparent: true, depthWrite: false, fog: false, opacity: .9 }));
ridgeNear.scale.set(5200, 340, 1);
scene.add(ridgeNear);

/* a misty band that softens where the cloud sea meets the sky
   (the sun itself is the CSS radial gradient behind the canvas —
   browser gradients dither, so it never bands) */
const haze = new THREE.Sprite(new THREE.SpriteMaterial({
  map: puff, transparent: true, depthWrite: false, fog: false,
  opacity: .5, color: 0xD8C3A6 }));
haze.scale.set(9200, 620, 1);
scene.add(haze);

/* ---------- flight ---------- */

const SPEED = 46;            // units/second — a glide, not a chase
let last = performance.now() / 1000;

function place(t) {
  camera.position.set(
    Math.sin(t * 0.08) * 26,
    16 + Math.sin(t * 0.055) * 10,
    -t * SPEED
  );
  camera.rotation.set(-0.085, Math.sin(t * 0.05) * 0.02, 0);
  const cz = camera.position.z;
  haze.position.set(camera.position.x, -30, cz - 4150);
  ridgeFar.position.set(camera.position.x * 0.6 + 160, -120, cz - 4200);
  ridgeNear.position.set(camera.position.x * 0.35 - 420, -190, cz - 3500);
  for (const sp of clouds) {
    if (sp.position.z > cz + 220) {
      sp.position.z -= DEPTH + 400;
      sp.position.x = (Math.random() - 0.5) * 2600;
    }
    sp.position.x += Math.sin(t * 0.11 + sp.position.z * 0.001) * sp.userData.drift * 0.016;
  }
  renderer.render(scene, camera);
}

const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (still) {
  place(2.5);                 // one considered frame, no motion
} else {
  renderer.setAnimationLoop(() => place(performance.now() / 1000));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (still) place(2.5);
});
</script>
</body>
</html>
